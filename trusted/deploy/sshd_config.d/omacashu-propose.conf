# /etc/ssh/sshd_config.d/omacashu-propose.conf  (trusted device; root-owned, 0644)
# Validate:  sshd -t  &&  sshd -T -C user=omacashu-propose,host=omarchy,addr=192.0.2.10 | grep -iE 'forcecommand|permittty|disableforwarding|authorizedkeysfile'
Match User omacashu-propose
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    GatewayPorts no
    MaxSessions 1
    ForceCommand /usr/bin/python3 -I -B /opt/omacashu/trusted/bridge/omacashu_ssh_bridge.py
